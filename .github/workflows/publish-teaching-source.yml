name: Publish Teaching Schedule Source

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public repository containing the reviewed TeachingScheduleSource release asset.
        required: true
        type: string
        default: hicancan/njupt-jwxt
      release_tag:
        description: Release tag containing the source archive.
        required: true
        type: string
      source_id:
        description: Expected njupt-teaching-schedule-source identity.
        required: true
        type: string
      archive_sha256:
        description: Expected SHA-256 of the deterministic source archive.
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: teaching-schedule-source
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_ID: ${{ inputs.source_id }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v8.2.0

      - uses: oras-project/setup-oras@v1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.3/oras_1.3.3_linux_amd64.tar.gz
          checksum: 9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59

      - name: Install source validator
        run: uv sync --frozen --extra test

      - name: Download and validate the reviewed source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$SOURCE_RELEASE_TAG" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$SOURCE_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          archive="njupt-teaching-schedule-source-${SOURCE_ID}.tar.zst"
          mkdir "$RUNNER_TEMP/source-release" "$RUNNER_TEMP/teaching-source"
          gh release download "$SOURCE_RELEASE_TAG" \
            --repo "$SOURCE_REPOSITORY" \
            --pattern "$archive" \
            --dir "$RUNNER_TEMP/source-release"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/source-release/$archive" \
            | sha256sum --check -
          tar --zstd -xf "$RUNNER_TEMP/source-release/$archive" \
            -C "$RUNNER_TEMP/teaching-source"
          SOURCE_ROOT="$RUNNER_TEMP/teaching-source" uv run python -c \
            'import os; from pathlib import Path; from academics.timetable.model import load_teaching_schedule_source; source = load_teaching_schedule_source(Path(os.environ["SOURCE_ROOT"])); assert source.source_id == os.environ["SOURCE_ID"]'

      - name: Publish immutable source and update the current pointer
        env:
          GH_TOKEN: ${{ secrets.NJUPT_SEARCH_GITHUB_TOKEN }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?NJUPT_SEARCH_GITHUB_TOKEN is required}"
          archive="njupt-teaching-schedule-source-${SOURCE_ID}.tar.zst"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER}/njupt-teaching-schedule-source"
          printf '%s' "$REGISTRY_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if digest="$(oras resolve "$registry:$SOURCE_ID" 2>/dev/null)"; then
            mkdir "$RUNNER_TEMP/published-source"
            oras pull "$registry@$digest" --output "$RUNNER_TEMP/published-source"
            printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/published-source/$archive" \
              | sha256sum --check -
          else
            (
              cd "$RUNNER_TEMP/source-release"
              oras push \
                --artifact-type application/vnd.njupt.teaching-schedule-source \
                --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${SOURCE_REPOSITORY}" \
                "$registry:$SOURCE_ID" \
                "$archive:application/vnd.njupt.teaching-schedule-source+zstd"
            )
            digest="$(oras resolve "$registry:$SOURCE_ID")"
          fi
          source_artifact="$(
            jq -cn \
              --arg ref "$registry@$digest" \
              --arg id "$SOURCE_ID" \
              --arg archive "$archive" \
              --arg sha256 "$ARCHIVE_SHA256" \
              '{ref:$ref,id:$id,archive:$archive,sha256:$sha256}'
          )"
          bash .github/scripts/gh-variable-set-with-retry.sh TEACHING_SOURCE_ARTIFACT "$source_artifact"
